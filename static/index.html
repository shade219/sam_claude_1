<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Digest</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: #f1f5f9; color: #0f172a; min-height: 100vh; }

    /* ── Header ── */
    header { background: #0f172a; color: white; padding: 1rem 2rem 0.85rem; }
    .header-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; }
    .header-title { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.3px; }
    .header-date  { font-size: 0.78rem; color: #94a3b8; margin-top: 0.2rem; }
    .header-meta  { font-size: 0.75rem; color: #475569; margin-top: 0.5rem; min-height: 1em; }

    /* ── Refresh button ── */
    .btn-refresh { background: #3b82f6; color: white; border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-size: 0.82rem; font-weight: 600; display: flex; align-items: center; gap: 0.35rem; transition: background 0.15s; flex-shrink: 0; }
    .btn-refresh:hover:not(:disabled) { background: #2563eb; }
    .btn-refresh:disabled { background: #334155; cursor: not-allowed; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinning { display: inline-block; animation: spin 0.75s linear infinite; }

    /* ── Topic tabs ── */
    nav { background: white; border-bottom: 1px solid #e2e8f0; padding: 0 2rem; display: flex; align-items: stretch; overflow-x: auto; scrollbar-width: none; }
    nav::-webkit-scrollbar { display: none; }
    .tab { padding: 0.8rem 1rem; border: none; background: none; cursor: pointer; font-size: 0.85rem; color: #64748b; border-bottom: 3px solid transparent; white-space: nowrap; display: flex; align-items: center; gap: 0.4rem; transition: color 0.15s; }
    .tab:hover { color: #0f172a; }
    .tab.active { color: #3b82f6; border-bottom-color: #3b82f6; font-weight: 600; }
    .tab-badge { background: #f1f5f9; color: #94a3b8; border-radius: 10px; padding: 0.1rem 0.42rem; font-size: 0.7rem; font-weight: 700; }
    .tab.active .tab-badge { background: #dbeafe; color: #3b82f6; }
    .tab-remove { font-size: 0.65rem; color: #cbd5e1; border: none; background: none; cursor: pointer; padding: 0 0 0 0.1rem; line-height: 1; border-radius: 3px; transition: color 0.15s; }
    .tab-remove:hover { color: #ef4444; }
    /* Add topic button */
    .btn-add-topic { padding: 0.8rem 0.85rem; border: none; background: none; cursor: pointer; font-size: 1.1rem; color: #94a3b8; border-bottom: 3px solid transparent; transition: color 0.15s; flex-shrink: 0; }
    .btn-add-topic:hover { color: #3b82f6; }
    /* Add topic inline form */
    .add-topic-form { display: none; align-items: center; gap: 0.5rem; padding: 0.4rem 0.5rem 0.4rem 1rem; border-left: 1px solid #e2e8f0; }
    .add-topic-form.visible { display: flex; }
    .add-topic-input { border: 1px solid #cbd5e1; border-radius: 6px; padding: 0.3rem 0.6rem; font-size: 0.82rem; outline: none; width: 140px; }
    .add-topic-input:focus { border-color: #3b82f6; }
    .btn-confirm-topic { background: #3b82f6; color: white; border: none; border-radius: 6px; padding: 0.3rem 0.7rem; font-size: 0.8rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .btn-confirm-topic:disabled { background: #94a3b8; cursor: not-allowed; }
    .btn-cancel-topic { background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 0.8rem; padding: 0.3rem 0.4rem; }
    .btn-cancel-topic:hover { color: #64748b; }
    .add-topic-status { font-size: 0.75rem; color: #64748b; white-space: nowrap; }

    /* ── Main content ── */
    main { max-width: 800px; margin: 1.5rem auto; padding: 0 1rem 3rem; }

    /* ── State messages (loading / empty) ── */
    .state-msg { text-align: center; color: #94a3b8; padding: 4rem 0; font-size: 0.9rem; line-height: 1.6; }
    .loader { width: 28px; height: 28px; border: 3px solid #e2e8f0; border-top-color: #3b82f6; border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 1rem; }

    /* ── Article cards ── */
    .card { background: white; border-radius: 10px; padding: 0.95rem 1.1rem; margin-bottom: 0.65rem; border: 1px solid #e2e8f0; display: flex; gap: 0.9rem; align-items: flex-start; transition: box-shadow 0.15s, border-color 0.15s; }
    .card:hover { box-shadow: 0 4px 14px rgba(0,0,0,0.07); border-color: #cbd5e1; }

    /* Rank */
    .rank { min-width: 2rem; text-align: center; padding-top: 1px; flex-shrink: 0; }
    .rank-num { font-size: 0.82rem; font-weight: 700; color: #cbd5e1; }
    .rank-1 .rank-num { color: #f59e0b; }
    .rank-2 .rank-num { color: #94a3b8; }
    .rank-3 .rank-num { color: #c2874f; }

    /* Body */
    .card-body { flex: 1; min-width: 0; }
    .card-title { font-size: 0.95rem; font-weight: 600; line-height: 1.45; margin-bottom: 0.4rem; }
    .card-title a { color: #0f172a; text-decoration: none; }
    .card-title a:hover { color: #3b82f6; }

    /* Meta */
    .card-meta { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; font-size: 0.73rem; color: #64748b; margin-bottom: 0.55rem; }
    .trust-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .dot-trusted  { background: #10b981; }
    .dot-unknown  { background: #cbd5e1; }
    .meta-sep { color: #e2e8f0; }

    /* Score bar */
    .score-row { display: flex; align-items: center; gap: 0.55rem; }
    .bar-track { flex: 1; height: 3px; background: #f1f5f9; border-radius: 2px; overflow: hidden; }
    .bar-fill  { height: 100%; border-radius: 2px; }
    .fill-high { background: #10b981; }
    .fill-mid  { background: #f59e0b; }
    .fill-low  { background: #cbd5e1; }
    .score-val { font-size: 0.7rem; color: #94a3b8; font-weight: 700; min-width: 2.5rem; text-align: right; }
  </style>
</head>
<body>

<header>
  <div class="header-top">
    <div>
      <div class="header-title">Daily Digest</div>
      <div class="header-date" id="header-date"></div>
    </div>
    <button class="btn-refresh" id="btn-refresh" onclick="triggerRefresh()">
      <span id="refresh-icon">↻</span> Refresh
    </button>
  </div>
  <div class="header-meta" id="header-meta">&nbsp;</div>
</header>

<nav id="topic-nav">
  <button class="btn-add-topic" title="Add topic" onclick="showAddTopic()">＋</button>
  <div class="add-topic-form" id="add-topic-form">
    <input class="add-topic-input" id="add-topic-input" type="text" placeholder="e.g. economics" maxlength="50"
           onkeydown="if(event.key==='Enter')confirmAddTopic(); if(event.key==='Escape')hideAddTopic();" />
    <button class="btn-confirm-topic" id="btn-confirm-topic" onclick="confirmAddTopic()">Add</button>
    <button class="btn-cancel-topic" onclick="hideAddTopic()">✕</button>
    <span class="add-topic-status" id="add-topic-status"></span>
  </div>
</nav>

<main>
  <div id="state-area"></div>
  <div id="articles"></div>
</main>

<script>
  let topics = [];
  let builtinTopics = new Set();
  let topicCounts = {};
  let activeTopic = null;

  /* ── Helpers ── */

  function esc(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function safeUrl(url) {
    try {
      const u = new URL(url);
      return (u.protocol === 'http:' || u.protocol === 'https:') ? esc(url) : '#';
    } catch { return '#'; }
  }

  function timeAgo(dateStr) {
    if (!dateStr) return '';
    const diff = (Date.now() - new Date(dateStr)) / 1000;
    if (diff < 60)     return 'just now';
    if (diff < 3600)   return `${Math.floor(diff / 60)}m ago`;
    if (diff < 86400)  return `${Math.floor(diff / 3600)}h ago`;
    if (diff < 172800) return 'Yesterday';
    return `${Math.floor(diff / 86400)}d ago`;
  }

  function scoreClass(s) {
    if (s >= 0.65) return 'fill-high';
    if (s >= 0.40) return 'fill-mid';
    return 'fill-low';
  }

  function setLoading(on) {
    const btn  = document.getElementById('btn-refresh');
    const icon = document.getElementById('refresh-icon');
    btn.disabled    = on;
    icon.className  = on ? 'spinning' : '';
    icon.textContent = '↻';
  }

  function setState(html) {
    document.getElementById('state-area').innerHTML = html;
    document.getElementById('articles').innerHTML   = '';
  }

  /* ── Nav ── */

  function renderNav() {
    const nav = document.getElementById('topic-nav');
    // Keep the add-button and form at the front, rebuild tabs after them
    const addBtn  = nav.querySelector('.btn-add-topic');
    const addForm = nav.querySelector('.add-topic-form');
    // Remove old tab buttons
    nav.querySelectorAll('.tab').forEach(el => el.remove());
    // Insert tabs before the add button
    topics.slice().reverse().forEach(t => {
      const isBuiltin = builtinTopics.has(t);
      const tabEl = document.createElement('button');
      tabEl.className = 'tab' + (t === activeTopic ? ' active' : '');
      tabEl.id = `tab-${esc(t)}`;
      tabEl.innerHTML =
        `${esc(t)}<span class="tab-badge">${topicCounts[t] ?? 0}</span>` +
        (!isBuiltin ? `<span class="tab-remove" title="Remove topic" onclick="event.stopPropagation();removeTopic('${esc(t)}')">✕</span>` : '');
      tabEl.onclick = () => selectTopic(t);
      nav.insertBefore(tabEl, addBtn);
    });
  }

  /* ── Add / remove topics ── */

  function showAddTopic() {
    document.getElementById('add-topic-form').classList.add('visible');
    document.getElementById('add-topic-input').focus();
  }

  function hideAddTopic() {
    document.getElementById('add-topic-form').classList.remove('visible');
    document.getElementById('add-topic-input').value = '';
    document.getElementById('add-topic-status').textContent = '';
    document.getElementById('btn-confirm-topic').disabled = false;
  }

  async function confirmAddTopic() {
    const input = document.getElementById('add-topic-input');
    const topic = input.value.trim();
    if (!topic) return;
    const btn    = document.getElementById('btn-confirm-topic');
    const status = document.getElementById('add-topic-status');
    btn.disabled = true;
    status.textContent = 'Generating config with Claude…';
    try {
      const res = await fetch('/api/topics', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ topic }),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        status.textContent = err.detail || 'Error adding topic';
        btn.disabled = false;
        return;
      }
      hideAddTopic();
      // Reload topics and select the new one
      const data = await fetch('/api/topics').then(r => r.json());
      topics = data.topics ?? [];
      builtinTopics = new Set(data.builtin ?? []);
      await loadStatus();
      selectTopic(topic);
    } catch {
      status.textContent = 'Request failed';
      btn.disabled = false;
    }
  }

  async function removeTopic(topic) {
    if (!confirm(`Remove topic "${topic}" and all its articles?`)) return;
    const res = await fetch(`/api/topics/${encodeURIComponent(topic)}`, { method: 'DELETE' });
    if (!res.ok) { alert('Failed to remove topic'); return; }
    topics = topics.filter(t => t !== topic);
    if (activeTopic === topic) activeTopic = topics[0] ?? null;
    renderNav();
    if (activeTopic) await loadArticles(activeTopic);
  }

  /* ── Status ── */

  function formatNextRun(isoStr) {
    if (!isoStr) return null;
    const d = new Date(isoStr);
    const now = new Date();
    const isToday    = d.toDateString() === now.toDateString();
    const isTomorrow = d.toDateString() === new Date(now.getTime() + 86400000).toDateString();
    const time = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZoneName: 'short' });
    if (isToday)    return `today at ${time}`;
    if (isTomorrow) return `tomorrow at ${time}`;
    return `${d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })} at ${time}`;
  }

  async function loadStatus() {
    try {
      const data  = await fetch('/api/status').then(r => r.json());
      const stats = data.topics ?? {};
      topicCounts = {};
      let lastFetched = null, total = 0;
      for (const [t, s] of Object.entries(stats)) {
        topicCounts[t] = s.count;
        total += s.count;
        if (s.last_fetched && (!lastFetched || s.last_fetched > lastFetched)) lastFetched = s.last_fetched;
      }
      const nextRun   = formatNextRun(data.next_scheduled_run);
      const lastPart  = lastFetched ? `Last updated ${timeAgo(lastFetched)} · ${total} article${total !== 1 ? 's' : ''}` : 'No articles yet — click Refresh to fetch';
      const nextPart  = nextRun ? ` · Next auto-refresh ${nextRun}` : '';
      document.getElementById('header-meta').textContent = lastPart + nextPart;
      renderNav();
    } catch { /* status is non-critical */ }
  }

  /* ── Boot ── */

  async function loadTopics() {
    document.getElementById('header-date').textContent =
      new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    setState('<div class="state-msg"><div class="loader"></div>Loading…</div>');
    const data = await fetch('/api/topics').then(r => r.json());
    topics = data.topics ?? [];
    builtinTopics = new Set(data.builtin ?? []);
    await loadStatus();
    if (topics.length > 0) selectTopic(topics[0]);
  }

  /* ── Topic selection ── */

  async function selectTopic(topic) {
    activeTopic = topic;
    renderNav();
    await loadArticles(topic);
  }

  /* ── Article rendering ── */

  async function loadArticles(topic) {
    setState('<div class="state-msg"><div class="loader"></div>Loading articles…</div>');
    try {
      const data     = await fetch(`/api/articles?topic=${encodeURIComponent(topic)}`).then(r => r.json());
      const articles = data.articles ?? [];
      document.getElementById('state-area').innerHTML = '';
      if (articles.length === 0) {
        setState('<div class="state-msg">No articles yet for this topic.<br>Click <strong>Refresh</strong> to fetch the latest.</div>');
        return;
      }
      document.getElementById('articles').innerHTML = articles.map((a, i) => {
        const rank    = i + 1;
        const score   = a.score ?? 0;
        const trusted = (a.trust_score ?? 0) >= 0.8;
        return `
          <div class="card">
            <div class="rank rank-${rank <= 3 ? rank : 'n'}">
              <span class="rank-num">#${rank}</span>
            </div>
            <div class="card-body">
              <div class="card-title">
                <a href="${safeUrl(a.url)}" target="_blank" rel="noopener noreferrer">${esc(a.title)}</a>
              </div>
              <div class="card-meta">
                <span class="trust-dot ${trusted ? 'dot-trusted' : 'dot-unknown'}"></span>
                <span>${esc(a.source || 'Unknown')}</span>
                <span class="meta-sep">·</span>
                <span>${timeAgo(a.published_at)}</span>
              </div>
              <div class="score-row">
                <div class="bar-track"><div class="bar-fill ${scoreClass(score)}" style="width:${Math.round(score * 100)}%"></div></div>
                <span class="score-val">${score.toFixed(2)}</span>
              </div>
            </div>
          </div>`;
      }).join('');
    } catch {
      setState('<div class="state-msg">Failed to load articles. Is the server running?</div>');
    }
  }

  /* ── Refresh ── */

  async function triggerRefresh() {
    setLoading(true);
    setState('<div class="state-msg"><div class="loader"></div>Fetching latest articles…</div>');
    try {
      await fetch('/api/refresh', { method: 'POST' });
      await loadStatus();
      if (activeTopic) await loadArticles(activeTopic);
    } catch {
      setState('<div class="state-msg">Refresh failed — check the server logs.</div>');
    } finally {
      setLoading(false);
    }
  }

  loadTopics();
</script>
</body>
</html>
